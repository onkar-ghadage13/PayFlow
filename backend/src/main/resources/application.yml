server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: payflow
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  jwt:
    secret: ${PAYFLOW_JWT_SECRET:local-development-secret-key-change-before-deployment-2026}
    expiration-ms: 86400000
  cors:
    allowed-origin: ${PAYFLOW_FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    email: ${PAYFLOW_ADMIN_EMAIL:}
