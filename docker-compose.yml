services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: payflow
      MYSQL_USER: payflow
      MYSQL_PASSWORD: ${DB_PASSWORD:-payflow-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-payflow-root-local}
    ports:
      - "3306:3306"
    volumes:
      - payflow-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: payflow
      DB_USER: payflow
      DB_PASSWORD: ${DB_PASSWORD:-payflow-local}
      PAYFLOW_JWT_SECRET: ${PAYFLOW_JWT_SECRET:-local-development-secret-change-before-deployment}
      PAYFLOW_ADMIN_EMAIL: ${PAYFLOW_ADMIN_EMAIL:-}
      PAYFLOW_FRONTEND_ORIGIN: http://localhost:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: payflow
      DB_USER: payflow
      DB_PASSWORD: ${DB_PASSWORD:-payflow-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8081:8081"

  insights-service:
    build:
      context: .
      dockerfile: insights-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: payflow
      DB_USER: payflow
      DB_PASSWORD: ${DB_PASSWORD:-payflow-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYFLOW_JWT_SECRET: ${PAYFLOW_JWT_SECRET:-local-development-secret-change-before-deployment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - insights-service
      - notification-service
    ports:
      - "3000:80"

volumes:
  payflow-mysql:
